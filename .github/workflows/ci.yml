name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -r | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: derived-data-${{ runner.os }}-${{ hashFiles('Stride.xcodeproj/project.pbxproj', 'Stride/**/*.swift', 'StrideTests/**/*.swift', 'StrideUITests/**/*.swift') }}
          restore-keys: |
            derived-data-${{ runner.os }}-

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-tools-${{ runner.os }}

      - name: Install tools
        run: brew install sonar-scanner swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Build & test with coverage
        run: ./scripts/generate-coverage.sh

      - name: SonarCloud scan
        run: sonar-scanner -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
